<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ALI.">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">

    <div class="auth-wrapper">
      
        <header class="auth-header">
            <h1 class="auth-logo">ALI<span>WORLD</span></h1>

            <p class="auth-subtitle">Connect with friends and the world around you.</p>
        </header>

       

        <main class="auth-card">
        <h2 class="auth-card-title">SignUp</h2>
            
            <form class="auth-form" action="index.html" method="GET">
               

                <div class="form-group">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required autocomplete="username">
                
                </div>

               
                <div   class="form-group">
                    <label
                     for="password" class="form-label">Password:</label>
                    
                     <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                </div>

               
                <button type="submit" class="btn btn-primary btn-full" style="padding: 0.75rem; font-weight: 600; font-size: 1rem; margin-top: 0.5rem;">
                    Login
                </button>

            </form>

            
            <div class="auth-footer-link">
                Don't have an account? <a href="#">Register here</a>
            </div>
        </main>

        <!-- Footer Copyright -->
        <footer class="auth-footer-copyright">
            &copy; 2026 ALIWORLD. All rights reserved.
        </footer>
    </div>

</body>
</html>
