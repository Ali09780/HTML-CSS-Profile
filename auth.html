<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ALI.">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-body" style="margin:0, pading:0">

    <div class="auth_wrapper">

        <header class="auth_header">

            <h1 class="auth__logo">ALI<span>WORLD</span></h1>

            <p class="auth__subtitle">Connect with friends and the world around you.</p>
        </header>



        <main class="auth--card">

            <h2 class="auth-card-heading">Log-in</h2>

            <form class="form-settings" action="index.html">


                <div class="form_group">
                    <label for="email" class="form-label">Email:</label>

                    <input type="email" id="username1" class="form-control_interval" placeholder="Enter your email"
                        required>

                    <!----id=username1-->
                </div>


                <div class="form_group">
                    <div>
                        <label for="password" class="form-label">Password:</label>

                        <input type="password" id="password" class="form-control_interval"
                            placeholder="Enter your password" required>
                    </div>
                </div>


                <button type="submit" class="btn btn-primary btn-full"
                    style="padding: 0.75rem; font-weight: 600; font-size: 1rem; margin-top: 0.5rem;">
                    Login
                </button>

            </form>


            <div class="auth-link">
                Don't have an account? <a href="register.html">Register here</a>
            </div>
        </main>


        <!-- Footer Copyright -->
        <footer class="auth-footer-copyright">
            &copy; 2026 ALIWORLD. All rights reserved.
        </footer>
    </div>


    <script src="auth.js"></script>

</body>

</html>
