<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ALIWORLD Register">
    <title>Register</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-body">

<div class="auth_wrapper1">

   
    <header class="auth_header">

        <h1 class="auth__logo">
            ALI<span>WORLD</span>
        </h1>

        <p class="auth__subtitle" style="color:aliceblue">
            Connect with friends and the world around you.
        </p>

    </header>

   

    <main class="auth--card">

        <h2 class="auth-card-heading">Register</h2>

        <form class="form-settings" action="index.html">

            

            <div class="form_group">

                <label for="username" class="form-label">
                    Username:
                </label>

                <input
                    type="text"
                    id="username"
                    class="form-control_interval"
                    placeholder="Enter your username"
                    required
                >

            </div>

          

            <div class="form_group">

                <label for="email" class="form-label">
                    Email:
                </label>

                <input
                    type="email"
                    id="email"
                    class="form-control_interval"
                    placeholder="Enter your email"
                    required>
            </div>

          

            <div class="form_group">

                <label for="password" class="form-label">
                    Password:
                </label>

                <input
                    type="password"
                    id="password"
                    class="form-control_interval"
                    placeholder="Create a password"
                    required
                >

            </div>

          
        

            <div class="form_group">

                <label for="confirmPassword" class="form-label">
                    Confirm Password:
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    class="form-control_interval"
                    placeholder="Confirm your password"
                    required
                >

            </div>

          

            <button
                type="submit"
                class="btn btn-primary btn-full"
                style="padding:0.75rem;font-weight:600;font-size:1rem;margin-top:0.5rem;">

                Signup

            </button>

        </form>

       
        <div class="auth-link">
            Already have an account?
            <a href="auth.html">Login here</a>
        </div>

    </main>

    <!-- Footer -->

    <footer class="auth-footer-copyright">
        &copy; 2026 ALIWORLD. All rights reserved.
    </footer>

</div>

<script src="auth.js"></script>

</body>
</html>
