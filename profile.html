<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="profile things.">
    <title>Ali Profile</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Sticky Header -->
    <header class="sticky-header">
        <div class="container header-container">
            <!-- Left: Logo -->
            <a href="index.html" class="logo">
                ALI<span>World</span>
            </a>

            <form class="search-form" action="#" method="GET">
                <input type="text" class="search-input" placeholder="Search for friends, posts, or topics..." required>
                <button type="submit" class="search-btn">Search</button>
            </form>


            <div class="header-right">
                <nav class="nav-links">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="profile.html" class="nav-link active">Profile</a>
                    <a href="explore.html" class="nav-link">Explore</a>
                    <a href="about.html" class="nav-link ">About</a>
                    <a href="auth.html" class="nav-link">Logout</a>
                     <button id="themeBtn" style="background-color: blanchedalmond; border-radius: 14px; padding:6px">🌙</button>
                </nav>
                <a href="profile.html">
                    <img src="./images/avatar.jfif" alt="alir" class="header-avatar">
                </a>
            </div>
        </div>
    </header>



    <div class="profile-container">


        <section class="profile_head">
            <!-- cover banner -->
            <div class="cover_image"></div>


            <div class="profile-info-mainsection">

                <div style="display: flex; justify-content: center; align-items: center;">
                    <div class="profile_avatar-wrapper">
                        <img src="./images/avatar.jfif" alt="Ali" class="profile_avatar">
                    </div>
                </div>

                <h1 class="name">Ali Nawaz</h1>

                <p class="intro">Software Developer | Web Enthusiast | QA Engineer | Devops Engineer</p>



                <!-- Flexbox -->
                <div class="profile-settings-row" >
                    <div class="profile__item" >
                        <span class="number" >2</span>
                        <span class="label" style="color: rgb(11, 11, 11);">Posts</span>
                    </div>
                    <div class="profile__item">

                        <span class="number">18</span>
                        <span class="label" style="color: rgb(11, 11, 11); gap:20px;">Followers</span>
                    </div>

                    <div class="profile__item">
                        <span class="number">1142</span>
                        <span class="label" style="color: rgb(11, 11, 11);">Following</span>
                    </div>
                </div>



                <!-- Buttons -->
                <div class="actions_butt">
                    <button class="btn btn-primary">Edit Profile</button>

                    <button class="btn btn-secondary">Send Message</button>
                </div>
            </div>
        </section>



        <!-- Profile Content Grid Section -->
        <section class="post_section">
            <h2 class="postheading">
                Random Posts <span>(15)</span>
            </h2>


            <div class="post">

                <!-- Grid Item 1 -->
                <div class="grid_item">
                    <img src="./images/WhatsApp Image 2026-07-19 at 5.56.08 PM.jpeg" alt="Post 1">
                    <div class="overlay">
                        <buttton>Delete</buttton>

                        <buttton>Edit</buttton>
                    </div>
                </div>


            
                <div class="grid_item">
                    <img src="./images/WhatsApp Image 2026-07-19 at 5.56.09 PM.jpeg"" alt=" Post 2">

                    <div class="overlay">
                        <div class="overlay">
                            <buttton>Delete</buttton>

                            <buttton>Edit</buttton>
                        </div>
                    </div>
                </div>

                <!-- Grid Item 3 -->
                <div class="grid_item">
                    <img src="./images/WhatsApp Image 2026-07-19 at 5.56.08 PM.jpeg" alt="Post 3">
                    <div class="overlay">
                        <div class="overlay">

                            <buttton>Delete</buttton>
                            <buttton>Edit</buttton>
                        </div>
                    </div>
                </div>

                <!-- Grid Item 4 -->
                <div class="grid_item">
                    <img src="./images/WhatsApp Image 2026-07-19 at 5.56.09 PM.jpeg"" alt=" Post 4">
                    <div class="overlay">
                        <div class="overlay">
                            <buttton>Delete</buttton>

                            <buttton>Edit</buttton>
                        </div>
                    </div>
                </div>

                <!-- Grid Item 5 -->
                <div class="grid_item">

                    <img src="./images/WhatsApp Image 2026-07-19 at 5.56.08 PM.jpeg" alt="Post 5">
                    <div class="overlay">
                        <div class="overlay">

                            <buttton>Delete</buttton>
                            <buttton>Edit</buttton>
                        </div>
                    </div>
                </div>


                <div class="grid_item">
                    <img src="./images/WhatsApp Image 2026-07-19 at 5.56.09 PM.jpeg" alt="Post 6">
                    <div class="overlay">


                        <div class="overlay">
                            <buttton>Delete</buttton>
                            <buttton>Edit</buttton>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>


    <script src="javascript.js"></script>
</body>

</html>
